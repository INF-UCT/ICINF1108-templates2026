name: icinf1108-templates2026-dotnet

services:
  api:
    build:
      context: .
      target: dev
    image: icinf1108-templates2026-dotnet:dev
    container_name: icinf1108-dotnet-api-dev
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Dentro de la red de Compose, Postgres se llama "db" (el nombre del servicio)
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-icinf1108};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    volumes:
      # Bind-mount the source for hot reload...
      - .:/app
      # ...but keep the container's own build output
      - /app/bin
      - /app/obj
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: icinf1108-dotnet-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-icinf1108}
    ports:
      # Expuesto al host para conectarse con DBeaver/psql o correr la API sin Docker
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Volumen nombrado: los datos sobreviven a `docker compose down`
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
